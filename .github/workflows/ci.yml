name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore HackerNews.BestStories.sln --locked-mode

      - name: Build
        run: dotnet build HackerNews.BestStories.sln --configuration Release --no-restore

      - name: Test
        run: >-
          dotnet test HackerNews.BestStories.sln
          --configuration Release
          --no-build
          --collect:"XPlat Code Coverage"
